<body>

     <div id="app">
        <!-- Your HTML template here -->
        <p>How Old Are You</p>
       <input type="number" v-model.number="age" placeholder="Your age" />

<p v-if="age === null || age === ''">Enter your age</p>
<p v-else-if="age < 18">You're a minor</p>
<p v-else-if="age < 65">You're an adult</p>
<p v-else>You're a senior</p>
    </div>
    
</body>

<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            
            // Your logic here
        const age = ref(null); 

            return {
                age,
            };
        }
    }).mount('#app');
    </script>
